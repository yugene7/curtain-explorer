name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CurtainExplorer.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CurtainExplorer-apk
          path: CurtainExplorer.apk

      - name: Publish as "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Curtain Explorer (latest build)
          body: Download CurtainExplorer.apk below and install it on the car through App Lab.
          files: CurtainExplorer.apk
          prerelease: false
          make_latest: true
